workflows:
  ios-native-unsigned:
    name: NodeLab unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          cd $CM_BUILD_DIR
          unzip -o nodelab-src.zip -d src
          cd src
          xcodebuild -project GuavaNodeLab.xcodeproj -target NodeLab -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build
          APP="$PWD/build/Release-iphoneos/Node Lab.app"
          mkdir -p "$APP/Frameworks"
          cp /Applications/Xcode-26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos/libswift*.dylib "$APP/Frameworks/"
          codesign -f -s - "$APP/Frameworks/"libswift*.dylib
          codesign -f -s - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "=== app contents ==="
          ls -la "Payload/Node Lab.app"
          echo "=== Frameworks ==="
          ls -la "Payload/Node Lab.app/Frameworks"
          zip -qry NodeLab-unsigned.ipa Payload
    artifacts:
      - src/NodeLab-unsigned.ipa
