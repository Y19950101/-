workflows:
  ios-native-unsigned:
    name: NodeLab unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          cd $CM_BUILD_DIR
          unzip -o nodelab-src.zip -d src
          cd src
          xcodebuild -project GuavaNodeLab.xcodeproj -target NodeLab -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- SYMROOT="$PWD/build" build
          mkdir -p Payload
          cp -R "$PWD/build/Release-iphoneos/Node Lab.app" Payload/
          echo "=== app contents ==="
          ls -la "Payload/Node Lab.app/"
          zip -qry NodeLab-unsigned.ipa Payload
    artifacts:
      - src/NodeLab-unsigned.ipa
