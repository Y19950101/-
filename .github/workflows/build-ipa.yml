name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Extract and build
        run: |
          unzip -o "NodeLab_Handoff_1.0.0_最终工程.zip" -d src
          cd src/NodeLab_Handoff_1.0.0
          xcodebuild -project GuavaNodeLab.xcodeproj -target NodeLab -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Node Lab.app" Payload/
          zip -qry NodeLab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NodeLab-unsigned
          path: src/NodeLab_Handoff_1.0.0/NodeLab-unsigned.ipa
