name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Unpack latest source
      run: |
        unzip -o nodelab-src.zip
        ls -la
    - name: Build unsigned app
      run: |
        xcodebuild -project GuavaNodeLab.xcodeproj -target NodeLab -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build
    - name: Ad-hoc sign and package IPA
      run: |
        APP="$PWD/build/Release-iphoneos/Node Lab.app"
        codesign -f -s - "$APP"
        mkdir -p Payload
        cp -R "$APP" Payload/
        zip -qry NodeLab-unsigned.ipa Payload
        ls -lh NodeLab-unsigned.ipa
    - uses: actions/upload-artifact@v4
      with:
        name: NodeLab-unsigned-ipa
        path: NodeLab-unsigned.ipa
        if-no-files-found: error
